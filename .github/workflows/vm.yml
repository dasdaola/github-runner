name: ngrok SSH VM

on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p /home/runner/.ssh

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/.ssh/authorized_keys

          chmod 700 /home/runner/.ssh
          chmod 600 /home/runner/.ssh/authorized_keys

          sudo chown -R runner:runner /home/runner/.ssh

      - name: Start SSH
        run: |
          sudo systemctl enable --now ssh

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok version

      - name: Configure ngrok
        run: |
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Start ngrok SSH tunnel
        run: |
          echo "Starting ngrok..."

          ngrok tcp 22 --log=stdout > /tmp/ngrok.log 2>&1 &

          sleep 8

          echo ""
          echo "======================================"
          echo "NGROK LOG"
          echo "======================================"

          cat /tmp/ngrok.log

          echo ""
          echo "======================================"
          echo "SSH CONNECTION"
          echo "======================================"

          ENDPOINT=$(grep -oE 'tcp://[^ ]+' /tmp/ngrok.log | head -n 1)

          if [ -z "$ENDPOINT" ]; then
            echo "ERROR: Could not find ngrok TCP endpoint."
            echo ""
            echo "Full ngrok output:"
            cat /tmp/ngrok.log
            exit 1
          fi

          echo "ngrok endpoint: $ENDPOINT"

          HOST=$(echo "$ENDPOINT" | sed -E 's#tcp://([^:]+):.*#\1#')
          PORT=$(echo "$ENDPOINT" | sed -E 's#tcp://[^:]+:([0-9]+).*#\1#')

          echo ""
          echo "Run this from your laptop:"
          echo ""
          echo "ssh -i ~/.ssh/id_ed25519 -p $PORT runner@$HOST"
          echo ""
          echo "======================================"

      - name: Keep VM alive
        run: sleep 21600
