name: ngrok SSH VM

on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p /home/runner/.ssh

          echo "${{ secrets.SSH_PUBLIC_KEY }}" \
            > /home/runner/.ssh/authorized_keys

          chmod 700 /home/runner/.ssh
          chmod 600 /home/runner/.ssh/authorized_keys

          sudo chown -R runner:runner /home/runner/.ssh

      - name: Start SSH
        run: |
          sudo systemctl enable --now ssh

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Configure ngrok
        run: |
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Start ngrok SSH tunnel
        run: |
          nohup ngrok tcp 22 \
            --log=stdout \
            > /tmp/ngrok.log 2>&1 &

          sleep 5

          echo "======================================"
          echo "NGROK SSH ENDPOINT"
          echo "======================================"

          curl -s http://127.0.0.1:4040/api/tunnels \
            | python3 -m json.tool

          echo "======================================"

      - name: Keep VM alive
        run: sleep 21600

